apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlresell-staging-stripe-to-amplitude-webhook
  namespace: default
  labels:
    app.kubernetes.io/name: stripe-to-amplitude
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stripe-to-amplitude
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stripe-to-amplitude
        app.kubernetes.io/component: webhook
    spec:
      containers:
        - name: webhook
          image: guimauvedigital/stripe-to-amplitude-webhook:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: USER_ID_STRATEGY
              value: "metadata.user_id"
            - name: USER_ID_FALLBACK
              value: "email,id"
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: stripe-to-amplitude
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
