name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: guimauvedigital/controlresell-ci/.github/workflows/publish-image.yml@v1
    with:
      builder: docker
      images: |
        guimauvedigital/stripe-to-amplitude-webhook Dockerfile.webhook
        guimauvedigital/stripe-to-amplitude-backfill Dockerfile.backfill
    secrets: inherit
