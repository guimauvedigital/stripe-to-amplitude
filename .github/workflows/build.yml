name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [ webhook, backfill ]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: guimauvedigitalholder
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and publish to Docker Hub
        run: |
          docker build -f Dockerfile.${{ matrix.target }} -t guimauvedigital/stripe-to-amplitude-${{ matrix.target }} .
          docker push guimauvedigital/stripe-to-amplitude-${{ matrix.target }}
