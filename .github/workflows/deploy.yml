name: Deploy
on:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ webhook, backfill ]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: guimauvedigitalholder
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and publish to Docker Hub
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/}
          docker build -f Dockerfile.${{ matrix.target }} -t guimauvedigital/stripe-to-amplitude-${{ matrix.target }}:$IMAGE_TAG .
          docker push guimauvedigital/stripe-to-amplitude-${{ matrix.target }}:$IMAGE_TAG
